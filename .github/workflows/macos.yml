name: macOS build

on:
  push:
    branches: [main, ci/macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  SDL_VERSION: "3.4.18"
  VULKAN_SDK_TAG: vulkan-sdk-1.4.350.1
  GLSLANG_VERSION: "16.6.0"
  VMA_VERSION: "3.4.0"
  MOLTENVK_VERSION: v1.4.2

jobs:
  macos:
    name: Build Nebula.app
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          echo "TOOLS=$HOME/nebula-tools" >> "$GITHUB_ENV"
          echo "WORK=$HOME/nebula-work" >> "$GITHUB_ENV"
          brew install llvm ninja
          llvm="$(brew --prefix llvm)"
          version="$("$llvm/bin/llvm-config" --version)"
          echo "LLVM_ROOT=$llvm" >> "$GITHUB_ENV"
          echo "LLVM_VERSION=$version" >> "$GITHUB_ENV"
          "$llvm/bin/clang++" --version
          cmake --version
          ninja --version
          xcodebuild -version
          rustup target add aarch64-apple-darwin
          cargo --version

      - name: Link LLVM into the tools folder
        run: |
          mkdir -p "$TOOLS/toolchain"
          ln -sfn "$LLVM_ROOT" "$TOOLS/toolchain/llvm"

      - name: Restore libc++
        id: libcxx-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: libcxx-macos-arm64-${{ env.LLVM_VERSION }}-${{ hashFiles('platform/apple/build_libcxx.sh') }}

      - name: Build libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/llvm-src"
          mkdir -p "$src"
          curl -fsSL -o "$RUNNER_TEMP/llvm-project.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-project.tar.xz" -C "$src" --strip-components 1
          sh platform/apple/build_libcxx.sh "$src" "$TOOLS/toolchain/llvm" "$TOOLS/toolchain/libcxx" macos arm64
          rm -rf "$TOOLS/toolchain/libcxx/build-macos-arm64"

      - name: Save libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: ${{ steps.libcxx-cache.outputs.cache-primary-key }}

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/nebula-tools/deps
          key: deps-${{ env.SDL_VERSION }}-${{ env.VULKAN_SDK_TAG }}-${{ env.GLSLANG_VERSION }}-${{ env.VMA_VERSION }}-${{ env.MOLTENVK_VERSION }}

      - name: Fetch dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          deps="$TOOLS/deps"
          mkdir -p "$deps"
          cd "$deps"
          fetch() { curl -fsSL "$1" | tar -xz; }
          fetch "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz"
          fetch "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/$VULKAN_SDK_TAG.tar.gz"
          fetch "https://github.com/zeux/volk/archive/refs/tags/$VULKAN_SDK_TAG.tar.gz"
          fetch "https://github.com/KhronosGroup/SPIRV-Cross/archive/refs/tags/$VULKAN_SDK_TAG.tar.gz"
          fetch "https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/archive/refs/tags/v$VMA_VERSION.tar.gz"
          mv "VulkanMemoryAllocator-$VMA_VERSION" "VulkanMemoryAllocator-v$VMA_VERSION"
          fetch "https://github.com/KhronosGroup/glslang/archive/refs/tags/$GLSLANG_VERSION.tar.gz"
          mv "glslang-$GLSLANG_VERSION" glslang-src
          fetch "https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/$VULKAN_SDK_TAG.tar.gz"
          mv "SPIRV-Tools-$VULKAN_SDK_TAG" glslang-src/External/spirv-tools
          fetch "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/$VULKAN_SDK_TAG.tar.gz"
          mv "SPIRV-Headers-$VULKAN_SDK_TAG" glslang-src/External/spirv-tools/external/spirv-headers
          mkdir -p MoltenVK
          curl -fsSL "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar" | tar -x -C MoltenVK
          ls -la "$deps" MoltenVK MoltenVK/*

      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/nebula-tools/deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build Nebula.app
        run: sh platform/apple/build_macos.sh -t "$TOOLS" -w "$WORK" -a arm64

      - name: List every compile error
        if: failure()
        run: |
          for tree in game host; do
            dir="$WORK/macos-arm64/$tree"
            [ -f "$dir/build.ninja" ] || continue
            targets="nebula_native"
            [ "$tree" = game ] && targets="smg_game smg_game_plain"
            echo "::group::$tree"
            ninja -C "$dir" -k 0 $targets 2>&1 | grep -E -A3 "error:|undefined|FAILED" | head -600 || true
            echo "::endgroup::"
          done

      - name: Upload Nebula.app
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-macOS
          path: ~/nebula-work/Nebula-macOS.zip
          if-no-files-found: error
